[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoasr"
version = "0.1.0"
description = "A minimal, hackable speech recognizer. Train a Conformer-CTC model on LibriSpeech from scratch."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
live = ["sounddevice>=0.4"]
dev = ["pytest", "matplotlib", "ipykernel"]

[project.scripts]
nanoasr-live = "nanoasr.live:main"
nanoasr-transcribe = "nanoasr.transcribe:main"
