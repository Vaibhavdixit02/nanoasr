[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-asr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
live = ["sounddevice>=0.4"]
export = ["coremltools>=7.0", "onnx"]
dev = ["pytest", "matplotlib", "ipykernel"]

[project.scripts]
nanoasr-live = "nanoasr.live:main"
